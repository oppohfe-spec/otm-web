<script>
/* =========================================================
   CONEXIÓN A GOOGLE SHEETS (Apps Script Web App)
   ========================================================= */
const APP_VERSION = '2.4';   // subir este número en cada cambio (el Sheet rechaza versiones viejas)
const CONFIG = {
  // Pegar acá la URL que entrega Apps Script al publicar ("Implementar > Nueva implementación > Aplicación web")
  API_URL: 'https://script.google.com/macros/s/AKfycby5adGxSt6whoB_ap98AMo7Px_geCMD9WruevmUrHyRuo_1iMxUjJIrNxruQSLyTcXu/exec'
};

const sleep = ms => new Promise(r=>setTimeout(r, ms));

/* fetch con tiempo límite.
   No se usa AbortController/signal: algunos entornos (vistas previas, WebViews,
   extensiones) reemplazan fetch por postMessage y no pueden clonar un AbortSignal
   → "DataCloneError: AbortSignal object could not be cloned". */
function fetchTimeout(url, opts={}, ms=45000){
  let t;
  const limite = new Promise((_, rej)=>{
    t = setTimeout(()=>{ const e = new Error('Tiempo de espera agotado'); e.name='AbortError'; rej(e); }, ms);
  });
  return Promise.race([fetch(url, opts), limite]).finally(()=>clearTimeout(t));
}

/*
 * GET con anti-caché + reintentos.
 * El 404 intermitente ocurre porque Apps Script responde con una redirección a
 * script.googleusercontent.com cuyo enlace caduca; si el navegador reutiliza esa
 * redirección guardada en caché (al reabrir la pestaña) obtiene 404.
 * Solución: parámetro único (_=timestamp), cache:'no-store' y reintentar.
 */
async function apiGet(action='snapshot', intentos=3){
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{
      const url = `${CONFIG.API_URL}?action=${action}&_=${Date.now()}_${i}`;
      const res = await fetchTimeout(url, {method:'GET', cache:'no-store', redirect:'follow'});
      if(!res.ok) throw new Error('No se pudo leer el Sheet ('+res.status+')');
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Error desconocido leyendo el Sheet');
      return data;
    }catch(err){
      ultimoError = err.name==='AbortError' ? new Error('Tiempo de espera agotado') : err;
      if(i < intentos-1) await sleep(800*(i+1));
    }
  }
  throw ultimoError;
}
async function apiPost(action, payload, intentos=2){
  let ultimoError;
  for(let i=0;i<intentos;i++){
    try{
      // Content-Type text/plain evita el preflight CORS que Apps Script no responde bien
      const res = await fetchTimeout(CONFIG.API_URL, {
        method:'POST', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({action, payload, v: APP_VERSION})
      }, 90000);   // escrituras: hasta 90 s (Apps Script puede tardar en "despertar")
      if(!res.ok) throw new Error('Error del servidor ('+res.status+')');
      const data = await res.json();
      if(!data.ok) throw new Error(data.error || 'Error desconocido guardando en el Sheet');
      return data;
    }catch(err){
      ultimoError = err.name==='AbortError' ? new Error('Tiempo de espera agotado') : err;
      // si el servidor respondió con un error de negocio, no se reintenta
      if(/versión antigua/i.test(ultimoError.message)) mostrarAvisoVersion();
      if(err.message && !/servidor|Failed to fetch|Tiempo|NetworkError|Load failed/i.test(ultimoError.message)) break;
      if(i < intentos-1) await sleep(1000);
    }
  }
  throw ultimoError;
}
function mostrarAvisoVersion(){
  if(document.getElementById('avisoVersion')) return;
  document.body.insertAdjacentHTML('afterbegin', `<div id="avisoVersion" class="fixed top-0 inset-x-0 z-[60] bg-amber-500 text-white text-sm font-medium px-4 py-2.5 flex items-center justify-center gap-3">
    Hay una versión nueva de la app.
    <button onclick="location.reload()" class="px-3 py-1 rounded-md bg-white text-amber-700 text-xs font-semibold">Actualizar ahora</button></div>`);
}
let pendientesSync = 0;
function paintSyncStatus(){
  const el = document.getElementById('syncStatus');
  if(el) el.textContent = pendientesSync ? `Guardando ${pendientesSync} cambio(s)…` : '';
}
function syncOTM(o){
  pendientesSync++; paintSyncStatus();
  return apiPost('upsert_otm', {otm:o})
    .catch(err=>{
      console.error(err);
      toast('No se pudo sincronizar con el Sheet: '+err.message, 'error');
      return false;
    })
    .finally(()=>{ pendientesSync--; paintSyncStatus(); });
}
// Aviso si el usuario intenta cerrar la página con cambios aún guardándose
window.addEventListener('beforeunload', e=>{ if(pendientesSync>0){ e.preventDefault(); e.returnValue=''; } });

/* =========================================================
   DATOS MAESTROS (se cargan desde el Google Sheet al iniciar;
   estos arrays quedan vacíos hasta que loadDataFromSheet() los llena)
   ========================================================= */
let EQUIPOS = [];   // se llenan desde el Sheet (antes había datos de ejemplo aquí)

// Actividad -> DNI -> Tipo_Mtto (MP=Preventivo, MC=Correctivo, MMJ=Mejora)
let ACTIVIDADES = {};
const TIPO_MTTO_LABEL = {MP:'Preventivo', MC:'Correctivo', MMJ:'Mejora'};
// Tipo de orden SAP asociado (según hoja ACTIVIDADES: columna "Tipo")
const TIPO_ORDEN_SAP = {MP:'OM03', MC:'OM01', MMJ:'OM04'};
const ORDEN_SAP_COLOR = {OM03:'bg-emerald-600', OM01:'bg-red-600', OM04:'bg-violet-600'};

// Maestro de personal (TRABAJADORES): Cargo + Estado definen quién puede ser Responsable o Técnico asignable
let PERSONAL = [];
let RESPONSABLES = [];
let TECNICOS = [];
let MATERIALES = [];

/* =========================================================
   FLUJO DE ESTADOS
   Pendiente -> Programada -> En ejecución -> Completada
   En ejecución puede pausarse por material/aprobación.
   Cancelada es posible desde cualquier estado previo al cierre.
   ========================================================= */
const ESTADOS = ['Pendiente','Programada','En ejecución','Esperando material','Esperando aprobación','Completada','Cancelada'];
const ESTADOS_TERMINALES = ['Completada','Cancelada'];
const ESTADO_TRANSICIONES = {
  'Pendiente':['Programada','En ejecución','Cancelada'],
  'Programada':['En ejecución','Cancelada'],
  'En ejecución':['Esperando material','Esperando aprobación','Completada','Cancelada'],
  'Esperando material':['En ejecución','Cancelada'],
  'Esperando aprobación':['En ejecución','Cancelada'],
  'Completada':[],
  'Cancelada':[],
};
const PRIORIDADES = ['Alta','Media','Baja'];

/* =========================================================
   UTILIDADES
   ========================================================= */
/* ---- Fechas SIEMPRE en hora de Perú (America/Lima, UTC-5, sin horario de verano) ---- */
const TZ = 'America/Lima';
const _fmtISO = new Intl.DateTimeFormat('en-CA',{timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit'});
function isoDate(d){ return _fmtISO.format(d); }            // 'YYYY-MM-DD' en hora Lima
function hoyLima(){ return isoDate(new Date()); }
const _fmtHora = new Intl.DateTimeFormat('en-GB',{timeZone:TZ, hour:'2-digit', minute:'2-digit', second:'2-digit', hourCycle:'h23'});
function horaLima(d=new Date()){ return _fmtHora.format(d); }  // 'HH:MM:SS' en hora Lima
/* Fecha elegida + HORA REAL del registro (hora Perú, UTC-5 fijo: Perú no usa horario de verano) */
function fechaDesdeInput(v){ return new Date(`${v}T${horaLima()}-05:00`); }
function fmtDate(d){
  return d.toLocaleDateString('es-PE',{timeZone:TZ, day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(d){
  return d.toLocaleString('es-PE',{timeZone:TZ, day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
/* La fecha se muestra tal como está en el Sheet (el servidor pone la hora real al crear). */
function normalizarFechaOTM(iso){
  const d = new Date(iso);
  return isNaN(d) ? new Date() : d;
}
/* Semanas (lunes a domingo) calculadas sobre la fecha Lima */
function addDaysISO(iso, n){ const d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function lunesDeISO(iso){ const d = new Date(iso+'T00:00:00Z'); const dow = (d.getUTCDay()+6)%7; return addDaysISO(iso, -dow); }
function numSemanaISO(iso){
  const d = new Date(iso+'T00:00:00Z'); const dow = (d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate() - dow + 3);                 // jueves de esa semana
  const inicioAnio = Date.UTC(d.getUTCFullYear(), 0, 1);
  return Math.ceil(((d - inicioAnio)/86400000 + 1)/7);
}
function ultimasSemanas(n=3){
  const lunes = lunesDeISO(hoyLima());
  return Array.from({length:n}, (_,i)=>{
    const ini = addDaysISO(lunes, -7*i), fin = addDaysISO(ini, 6);
    return {ini, fin, num:numSemanaISO(ini), label: i===0?'Semana actual':(i===1?'Semana pasada':'Hace 2 semanas')};
  });
}
const ddmm = iso => iso.slice(8,10)+'/'+iso.slice(5,7);

/* ---- Búsqueda: sin tildes, sin mayúsculas y con palabras en cualquier orden ---- */
function norm(s){ return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(); }
function tokens(q){ return norm(q).split(/[\s,;]+/).filter(Boolean); }
function coincide(hay, toks){ return toks.every(t => hay.includes(t)); }

/* Escapa texto para usarlo dentro de onclick="fn('...')" */
function jsq(s){ return String(s ?? '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

let OTMS = [];
let MATERIALES_CARGADOS = false;
let CORE_CARGADO = false;
let matCargando = null;       // promesa de carga en curso (evita cargas duplicadas)
let matUltimaCarga = 0;       // hora (ms) de la última lectura del stock
let MAT_ITEMS = [];   // items pre-calculados para el autocompletado de materiales

/* ---- Caché local (el navegador abre al instante con los últimos datos) ---- */
function lsGet(k){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; }catch(e){ return null; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ /* sin espacio o modo privado */ } }

/* =========================================================
   CARGA DE DATOS REALES DESDE EL GOOGLE SHEET
   ========================================================= */
function aplicarCore(data){
  EQUIPOS = data.equipos;
  ACTIVIDADES = data.actividades;
  PERSONAL = data.personal;
  // Comparación tolerante: ignora mayúsculas, tildes y espacios ("TECNICO", "Técnico ", "activo")
  const activo = p => norm(p.estado).trim()==='activo';
  const nombres = arr => [...new Set(arr.map(p=>String(p.nombre ?? '').trim()).filter(Boolean))];
  RESPONSABLES = nombres(PERSONAL.filter(p=> norm(p.cargo).trim()==='supervisor' && activo(p)));
  TECNICOS = nombres(PERSONAL.filter(p=> norm(p.cargo).trim()==='tecnico' && activo(p)));
  CORE_CARGADO = true;
  OTMS = data.otms.map(o=>({
    ...o,
    id: String(o.id),
    equipo: String(o.equipo ?? ''),
    actividad: String(o.actividad ?? ''),
    responsable: String(o.responsable ?? ''),
    fecha: normalizarFechaOTM(o.fecha),
    materiales: o.materiales || [],
    personalAsignado: o.personalAsignado || [],
    historial: (o.historial||[]).map(h=>({estado:h.estado, fecha:new Date(h.fecha)})),
  }));
  OTMS.sort((a,b)=> b.fecha - a.fecha);
  completarDescMateriales();
}
/* El catálogo llega en formato compacto [codigo, desc, unidad, stock, min, grupo] */
function aplicarMateriales(lista){
  MATERIALES = lista.map(m => Array.isArray(m)
    ? {codigo:String(m[0]), desc:String(m[1]), unidad:String(m[2]), stock:Number(m[3])||0, min:Number(m[4])||5, grupo:m[5]||''}
    : {...m, codigo:String(m.codigo), desc:String(m.desc ?? '')});
  MATERIALES.forEach(m=> m._q = norm(m.codigo+' '+m.desc));
  MAT_ITEMS = MATERIALES.map(m=>({value:m.codigo, label:`${m.codigo} · ${m.desc} (stock ${m.stock} ${m.unidad})`, q:m._q}));
  MATERIALES_CARGADOS = true;
  completarDescMateriales();
}
function completarDescMateriales(){
  if(!MATERIALES.length) return;
  const map = {}; MATERIALES.forEach(m=> map[m.codigo]=m);
  OTMS.forEach(o=> o.materiales.forEach(x=>{
    const c = map[String(x.codigo)];
    if(c){ if(!x.desc) x.desc = c.desc; if(!x.unidad) x.unidad = c.unidad; }
  }));
}
function vistaActual(){
  const v = document.querySelector('[id^="view-"]:not(.hidden)');
  return v ? v.id.replace('view-','') : 'gestion';
}
/* Re-pinta la vista activa sin borrar un formulario que el usuario esté llenando */
function refrescarVista(){
  const v = vistaActual();
  if(v==='crear'){ paintChipsCrear(); return; }   // solo agrega los botones, no borra lo escrito
  if(document.getElementById('modalRoot').innerHTML) return;
  if(v==='gestion') renderGestion();
  if(v==='dashboard') renderDashboard();
  if(v==='materiales') renderMateriales();
}

/* Lee el catálogo con el STOCK ACTUAL. Si ya se leyó hace menos de "maxEdadMs", no repite. */
function horaStock(){ return matUltimaCarga ? 'Stock actualizado a las '+new Date(matUltimaCarga).toLocaleTimeString('es-PE',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}) : ''; }
function cargarMaterialesEnSegundoPlano(maxEdadMs=0){
  if(matCargando) return matCargando;
  if(maxEdadMs && Date.now()-matUltimaCarga < maxEdadMs) return Promise.resolve();
  const st = document.getElementById('matStockInfo');
  if(st) st.textContent = 'Actualizando stock…';
  matCargando = (async ()=>{
    try{
      const d = await apiGet('materiales');
      matUltimaCarga = Date.now();
      aplicarMateriales(d.materiales);
      lsSet('otm_cache_mat', d.materiales);
      if(vistaActual()==='materiales' && !document.getElementById('modalRoot').innerHTML){
        const q = (document.getElementById('matSearch')||{}).value || '';
        renderMateriales();
        if(q){ document.getElementById('matSearch').value = q; filterMateriales(); }
      }
      actualizarStockEnModal();
    }catch(err){
      console.error(err);
      toast('No se pudo actualizar el stock: '+err.message, 'error');
    }finally{
      matCargando = null;
      const st2 = document.getElementById('matStockInfo');
      if(st2) st2.textContent = horaStock();
    }
  })();
  return matCargando;
}
/* Si hay un modal de material abierto, refresca el texto de stock con el valor nuevo */
function actualizarStockEnModal(){
  const txt = m => `Stock disponible: ${m.stock} ${esc(m.unidad)}${m.stock < m.min ? ' · <span class="text-amber-600 font-medium">stock bajo</span>':''}`;
  const info = document.getElementById('asoc_stockinfo');
  if(info && asocCodigo){ const m = MATERIALES.find(x=>x.codigo===asocCodigo); if(m) info.innerHTML = txt(m); }
  const q = document.getElementById('qmat_codigo');
  const el = document.getElementById('qmat_stockinfo');
  if(q && q.value && el){ const m = MATERIALES.find(x=>x.codigo===q.value); if(m) el.innerHTML = txt(m); }
}

function compararVersion(a, b){
  const pa = String(a).split('.').map(Number), pb = String(b).split('.').map(Number);
  for(let i=0;i<Math.max(pa.length,pb.length);i++){ const x=pa[i]||0, y=pb[i]||0; if(x!==y) return x<y?-1:1; }
  return 0;
}
async function initApp(){
  const root = document.getElementById('view-crear');
  const vEl = document.getElementById('appVersion'); if(vEl) vEl.textContent = 'v'+APP_VERSION;
  // 1) Pintar al instante con la última copia guardada en este navegador
  const cacheCore = lsGet('otm_cache_core');
  const cacheMat = lsGet('otm_cache_mat');
  if(cacheMat) aplicarMateriales(cacheMat);
  if(cacheCore){
    aplicarCore(cacheCore);
    CORE_CARGADO = false;   // hasta confirmar con el Sheet
    document.getElementById('syncStatus').textContent = 'Actualizando datos…';
  }
  navigate('crear');       // la app abre directamente en "Reportar OTM"
  // 2) Datos principales (rápido) y luego materiales (pesado) en segundo plano
  try{
    const core = await apiGet('core');
    if(core.minAppVersion && compararVersion(APP_VERSION, core.minAppVersion) < 0) mostrarAvisoVersion();
    aplicarCore(core);
    lsSet('otm_cache_core', core);
    paintSyncStatus();
    refrescarVista();
    cargarMaterialesEnSegundoPlano();
  }catch(err){
    if(cacheCore){
      document.getElementById('syncStatus').textContent = 'Sin conexión: mostrando últimos datos';
      toast('No se pudo actualizar desde el Sheet: '+err.message, 'error');
      return;
    }
    console.error(err);
    root.innerHTML = `<div class="bg-white rounded-xl shadow-card border border-red-200 p-6 text-sm text-red-700">
      No se pudo cargar la información desde el Sheet.<br>
      <span class="text-ink-500">${err.message}</span><br><br>
      Verifica que <code>CONFIG.API_URL</code> apunte a tu Apps Script publicado y que el acceso esté configurado como "Cualquier usuario".
      <div class="mt-3"><button onclick="initApp()" class="px-3 py-1.5 rounded-lg bg-brand-600 text-white text-xs font-medium">Reintentar</button></div>
    </div>`;
  }
}

/* =========================================================
   AUTOCOMPLETADO GENÉRICO (equipo, actividad, material)
   ========================================================= */
function wireAutocomplete({inputId, listId, itemsProvider, onPick, emptyText}){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  let timer = null;
  function show(query){
    if(input.disabled) return;
    const items = itemsProvider();
    if(items === null){ // catálogo aún cargando
      list.innerHTML = `<div class="px-3 py-2 text-xs text-ink-400">Cargando catálogo… intenta en unos segundos</div>`;
      list.classList.remove('hidden'); return;
    }
    const toks = tokens(query);
    const filtered = [];
    for(const it of items){                 // corta en 60 resultados: rápido aun con 14 000 ítems
      if(coincide(it.q || (it.q = norm(it.label)), toks)){ filtered.push(it); if(filtered.length>=60) break; }
    }
    if(filtered.length===0){
      list.innerHTML = `<div class="px-3 py-2 text-xs text-ink-400">${emptyText||'Sin resultados'}</div>`;
    } else {
      list.innerHTML = filtered.map(it=>`<div class="ac-opt px-3 py-2 text-sm hover:bg-brand-50 cursor-pointer" data-value="${esc(it.value)}" data-label="${esc(it.label)}">${esc(it.label)}</div>`).join('');
    }
    list.classList.remove('hidden');
  }
  input.addEventListener('focus', ()=> show(input.value));
  input.addEventListener('input', ()=>{ clearTimeout(timer); timer = setTimeout(()=>show(input.value), 120); });
  // Se oculta al salir del campo (antes se agregaba un listener global en cada render → fuga de memoria)
  input.addEventListener('blur', ()=> setTimeout(()=>list.classList.add('hidden'), 150));
  list.addEventListener('mousedown', (e)=>{
    const opt = e.target.closest('.ac-opt');
    if(!opt) return;
    e.preventDefault();
    input.value = opt.dataset.label;
    list.classList.add('hidden');
    onPick(opt.dataset.value, opt.dataset.label);
  });
}

/* Pinta los botones de supervisores y técnicos. Se vuelve a llamar cuando llegan los
   datos del Sheet, así el formulario nunca queda vacío si se abrió mientras cargaba. */
function paintChipsCrear(){
  const cR = document.getElementById('chipsResponsable');
  const cT = document.getElementById('chipsTecnicos');
  if(!cR || !cT) return;
  const selR = document.getElementById('f_responsable').value;
  const aviso = tipo => !CORE_CARGADO
    ? `<span class="text-xs text-ink-400">Cargando ${tipo}…</span>`
    : `<span class="text-xs text-amber-600">No hay ${tipo} activos. Revisa la hoja TRABAJADORES (Cargo = "${tipo==='supervisores'?'Supervisor':'Técnico'}", Estado = "Activo").</span>`;
  cR.innerHTML = RESPONSABLES.length ? RESPONSABLES.map(r=>{
    const on = r===selR;
    return `<button type="button" onclick="selectChip(this,'responsable','${jsq(r)}')" data-group="responsable" data-value="${esc(r)}"
      class="chip-responsable px-4 py-2 rounded-lg text-sm font-medium border ${on?'bg-ink-800 text-white border-ink-800':'border-ink-200 text-ink-600'}">${esc(r)}</button>`;
  }).join('') : aviso('supervisores');
  crearState.selectedTecnicos = crearState.selectedTecnicos.filter(t=>TECNICOS.includes(t));
  cT.innerHTML = TECNICOS.length ? TECNICOS.map(t=>{
    const on = crearState.selectedTecnicos.includes(t);
    return `<button type="button" onclick="toggleTecnico(this,'${jsq(t)}')"
      class="tecnico-chip px-3 py-1.5 rounded-full text-xs font-medium border ${on?'bg-brand-600 text-white border-brand-600':'border-ink-200 text-ink-600'} hover:border-brand-400 transition">${esc(t)}</button>`;
  }).join('') : aviso('técnicos');
  document.getElementById('tecnicosCount').textContent = crearState.selectedTecnicos.length;
}

function wireCrearAutocompletes(){
  wireAutocomplete({
    inputId:'ac_input_equipo', listId:'ac_list_equipo',
    itemsProvider: ()=> EQUIPOS.length ? EQUIPOS.map(e=>({value:String(e.dni), label:e.nombre})) : (CORE_CARGADO ? [] : null),
    onPick: (dni)=>{
      crearState.equipoDni = dni;
      document.getElementById('f_dni').value = dni;
      crearState.actividadNombre=''; crearState.actividadTipo='';
      const actInput = document.getElementById('ac_input_actividad');

  });
  wireAutocomplete({
    inputId:'ac_input_actividad', listId:'ac_list_actividad',

function construirOTMDesdeFormulario(){
  const equipo = EQUIPOS.find(x=>String(x.dni)===crearState.equipoDni);
  if(!equipo){ toast('Selecciona un equipo de la lista', 'error'); return null; }

  let actividadNombre, actividadTipo, esActividadLibre=false;
  if(crearState.actividadLibre){
    actividadNombre = document.getElementById('f_actividad_libre_nombre').value.trim();
    actividadTipo = document.getElementById('f_actividad_libre_tipo').value;
    esActividadLibre = true;
    if(!actividadNombre){ toast('Escribe el nombre de la nueva actividad', 'error'); return null; }
    // (la actividad se guarda en el Sheet recién cuando la OTM pasa todas las validaciones)
  } else {
    actividadNombre = crearState.actividadNombre;
    actividadTipo = crearState.actividadTipo;
    if(!actividadNombre){ toast('Selecciona una actividad o usa texto libre', 'error'); return null; }
  }

  const prioridad = document.getElementById('f_prioridad').value;
  const responsable = document.getElementById('f_responsable').value;
  if(!prioridad){ toast('Selecciona la prioridad', 'error'); return null; }
  if(!responsable){ toast('Selecciona el supervisor responsable', 'error'); return null; }
  const fechaTxt = document.getElementById('f_fecha').value;
  if(!fechaTxt){ toast('Indica la fecha de la OTM', 'error'); return null; }

  if(crearState.externoActivo){
    const cantExt = parseInt(document.getElementById('f_cant_externos').value)||0;
    if(cantExt < 1){ toast('La cantidad de externos debe ser mayor o igual a 1', 'error'); return null; }
  }

  const internos = crearState.selectedTecnicos.length;
  const externos = crearState.externoActivo ? Math.max(1, parseInt(document.getElementById('f_cant_externos').value)||0) : 0;
  const participantes = internos + externos;
  const fecha = fechaDesdeInput(fechaTxt);

  return {
    // Mismo ID en los reintentos del mismo formulario: si un intento falla a medias,
    // el siguiente ACTUALIZA esa fila en vez de crear una OTM duplicada.
    id: crearState.idOTM || (crearState.idOTM = `OTM-${Date.now().toString().slice(-6)}-${Math.floor(Math.random()*90+10)}`),
    fecha,
    equipo: equipo.nombre,
    dni: equipo.dni,
    actividad: actividadNombre,
    esActividadLibre,
    tipoMtto: actividadTipo,
    prioridad, responsable,
    estado: 'Pendiente',
    internos, externos, participantes,
    empresaContratista: null,
    componente: document.getElementById('f_componente').value.trim(),
    sintoma: document.getElementById('f_sintoma').value.trim(),
    causa: document.getElementById('f_causa').value.trim(),
    medida: document.getElementById('f_medida').value.trim(),
    actividadRealizada: '',
    comentarios: '',
    comentarioCierre: '',
    jornalesEjecutados: null, horasEjecutadas: null, hh: 0,
    personalAsignado: [...crearState.selectedTecnicos],
    materiales: crearState.materiales.map(m=>({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:m.cantidad})),
    historial: [{estado:'Pendiente', fecha:new Date()}],   // hora real de registro
  };
}

/* Guarda la OTM nueva ESPERANDO la confirmación del Sheet (evita duplicados por doble clic) */
let guardandoOTM = false;
function setGuardando(v){
  guardandoOTM = v;
  document.querySelectorAll('[data-guardar]').forEach(b=>{ b.disabled = v; b.classList.toggle('opacity-60', v); });
}
async function guardarNuevaOTM(nueva){
  if(nueva.esActividadLibre){
    await apiPost('nueva_actividad', {dni:nueva.dni, actividad:nueva.actividad, tipo:nueva.tipoMtto});
    const k = String(nueva.dni);
    if(!ACTIVIDADES[k]) ACTIVIDADES[k] = [];
    if(!ACTIVIDADES[k].some(a=>norm(a.a)===norm(nueva.actividad))) ACTIVIDADES[k].push({a:nueva.actividad, tipo:nueva.tipoMtto});
  }
  const r = await apiPost('upsert_otm', {otm:nueva});
  if(r && r.fecha) nueva.fecha = new Date(r.fecha);   // fecha y hora reales asignadas por el servidor
  OTMS.unshift(nueva);
}

function submitOTM(e){
  e.preventDefault();
  if(guardandoOTM) return false;
  const nueva = construirOTMDesdeFormulario();
  if(!nueva) return false;
  setGuardando(true);
  guardarNuevaOTM(nueva)
    .then(()=>{ toast(`OTM ${nueva.id} registrada en estado Pendiente`); navigate('gestion'); })
    .catch(err=> toast('No se pudo registrar la OTM: '+err.message, 'error'))
    .finally(()=> setGuardando(false));
  return false;
}

function mensajeWhatsAppOTM(o){
  const lineas = [
    `🛠️ *Nueva OTM registrada*`,
    `📋 *OTM:* ${o.id}`,
    `⚙️ *Equipo:* ${o.equipo}`,
    `🔢 *DNI:* ${o.dni}`,
    `🧰 *Actividad:* ${o.actividad}`,
    `🏷️ *Tipo:* ${TIPO_MTTO_LABEL[o.tipoMtto]} (${TIPO_ORDEN_SAP[o.tipoMtto]})`,
    `🚦 *Prioridad:* ${o.prioridad}`,
    `👷 *Responsable:* ${o.responsable}`,
    `📅 *Fecha:* ${fmtDate(o.fecha)}`,
  ];
  if(o.materiales && o.materiales.length){
    lineas.push(`📦 *Materiales solicitados:*`);
    o.materiales.forEach(m=>{
      lineas.push(`▫️ ${m.codigo} - ${m.desc} — Cant: ${m.cantidad} ${m.unidad}`);
    });
  }
  return lineas.join('\n');
}
function abrirWhatsApp(texto){
  window.open(`https://wa.me/?text=${encodeURIComponent(texto)}`, '_blank');
}
function cabeceraOTM(o){
  return [
    `📋 *OTM:* ${o.id}`,
    `⚙️ *Equipo:* ${o.equipo}`,
    `🧰 *Actividad:* ${o.actividad}`,
    `👷 *Responsable:* ${o.responsable}`,
  ];
}
/* Reenvío completo de una OTM, con su estado y datos actuales */
function mensajeReenvioOTM(o){
  const l = [`🔁 *OTM (reenvío)*`, ...cabeceraOTM(o)];
  l.splice(3, 0, `🔢 *DNI:* ${o.dni}`);
  l.push(
    `🏷️ *Tipo:* ${TIPO_MTTO_LABEL[o.tipoMtto]||''} (${TIPO_ORDEN_SAP[o.tipoMtto]||''})`,
    `🚦 *Prioridad:* ${o.prioridad}`,
    `📌 *Estado:* ${o.estado}`,
    `📅 *Fecha:* ${fmtDateTime(o.fecha)}`,
  );
  const diag = [o.componente, o.sintoma].filter(x=>x && x!=='—').join(' — ');
  if(diag) l.push(`🔍 *Diagnóstico:* ${diag}`);
  if(o.causa && o.causa!=='—') l.push(`❓ *Causa:* ${o.causa}`);
  if(o.medida && o.medida!=='—') l.push(`✅ *Medida:* ${o.medida}`);
  if(o.personalAsignado.length || o.externos){
    l.push(`👥 *Personal:* ${o.personalAsignado.join(', ') || '—'}${o.externos?` + ${o.externos} externo(s)`:''}`);
  }
  if(o.materiales.length){
    l.push(`📦 *Materiales:*`);
    o.materiales.forEach(m=> l.push(`▫️ ${m.codigo} - ${m.desc} — Cant: ${m.cantidad} ${m.unidad}`));
  }
  return l.join('\n');
}
function reenviarWhatsApp(id){
  const o = OTMS.find(x=>x.id===id);
  if(o) abrirWhatsApp(mensajeReenvioOTM(o));
}

/* ---- Materiales recién añadidos, pendientes de enviar por WhatsApp (por OTM) ----
   Solo se envían los que se agregaron desde el último envío. Se guardan en este
   navegador para no perderlos si se recarga la página. */
let MAT_NUEVOS = lsGet('otm_mat_nuevos') || {};   // { idOTM: [{codigo, desc, unidad, cantidad}] }
function guardarMatNuevos(){ lsSet('otm_mat_nuevos', MAT_NUEVOS); }
function registrarMatNuevo(otmId, m, cant){
  const lista = MAT_NUEVOS[otmId] = MAT_NUEVOS[otmId] || [];
  const ya = lista.find(x=>x.codigo===m.codigo);
  if(ya) ya.cantidad = +(ya.cantidad + cant).toFixed(3);
  else lista.push({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:cant});
  guardarMatNuevos();
}
function mensajeMaterialesNuevos(o, lista){
  const l = [`📦 *Materiales añadidos a OTM*`, ...cabeceraOTM(o), `📅 *Fecha:* ${fmtDateTime(new Date())}`, `🧾 *Materiales añadidos:*`];
  lista.forEach(m=> l.push(`▫️ ${m.codigo} - ${m.desc} — Cant: ${m.cantidad} ${m.unidad}`));
  return l.join('\n');
}
function enviarMatNuevosWhatsApp(otmId){
  const o = OTMS.find(x=>x.id===otmId);
  const lista = MAT_NUEVOS[otmId] || [];
  if(!o || !lista.length){ toast('No hay materiales nuevos por enviar en esta OTM', 'info'); return; }
  abrirWhatsApp(mensajeMaterialesNuevos(o, lista));
  delete MAT_NUEVOS[otmId];
  guardarMatNuevos();
  paintMatPendientes();
}
function descartarMatNuevos(otmId){
  delete MAT_NUEVOS[otmId]; guardarMatNuevos(); paintMatPendientes();
}
/* Aviso en la pestaña Materiales con los materiales añadidos aún no enviados */
function paintMatPendientes(){
  const el = document.getElementById('matPendientes');
  if(!el) return;
  // limpia OTM que ya no existen
  Object.keys(MAT_NUEVOS).forEach(id=>{ if(!OTMS.some(o=>o.id===id) || !MAT_NUEVOS[id].length) delete MAT_NUEVOS[id]; });

          return `<div class="flex flex-col sm:flex-row sm:items-center gap-2 bg-white rounded-lg border border-emerald-100 px-3 py-2">

      </div>
    </div>` : '';

  // La ventana se abre YA (dentro del clic) para que el navegador no la bloquee

}

function onQueryInput(){ gestionQuery = document.getElementById('filt_q').value.trim().toLowerCase(); paintGestionCards(); }
function onFiltroChange(){
  gestionFiltros.estado = document.getElementById('filt_estado').value;
  gestionFiltros.prioridad = document.getElementById('filt_prioridad').value;
  gestionFiltros.responsable = document.getElementById('filt_responsable').value;
  paintGestionCards();
}
function resetFiltros(){
  gestionQuery=''; gestionFecha=''; gestionFiltros={estado:'',prioridad:'',responsable:'',equipo:''};
  renderGestion();
}

function filteredOTMs(){
  return OTMS.filter(o=>{
    if(gestionFecha && isoDate(o.fecha)!==gestionFecha) return false;
    if(gestionQuery && !coincide(norm(`${o.id} ${o.equipo} ${o.responsable} ${o.actividad}`), tokens(gestionQuery))) return false;
    if(gestionFiltros.estado && o.estado!==gestionFiltros.estado) return false;
    if(gestionFiltros.prioridad && o.prioridad!==gestionFiltros.prioridad) return false;
    if(gestionFiltros.responsable && o.responsable!==gestionFiltros.responsable) return false;
    return true;
  });
}

/* ---- Modal: Ver (con Ejecución/cierre) / Editar / Cambiar estado ---- */
function openOTM(id, modo){
  const o = OTMS.find(x=>x.id===id);
  if(!o) return;
  if(modo==='ver') return openVerModal(o);
  if(modo==='editar') return openEditarModal(o);
  if(modo==='estado') return openEstadoModal(o);
}

function stepFlow(o){
  const orden = ['Pendiente','Programada','En ejecución','Completada'];
  const cancelada = o.estado==='Cancelada';
  const enPausa = o.estado==='Esperando material' || o.estado==='Esperando aprobación';
  const idxActual = enPausa ? 2 : orden.indexOf(o.estado);
  return `
  <div class="flex items-center mb-1">
    ${orden.map((e,i)=>`
      <div class="flex items-center ${i<orden.length-1?'flex-1':''}">
        <div class="step-dot ${cancelada ? 'bg-red-400' : i<=idxActual ? 'bg-brand-600':'bg-ink-200'}"></div>
        ${i<orden.length-1?`<div class="step-line ${cancelada ? 'bg-red-200' : i<idxActual ? 'bg-brand-600':'bg-ink-200'}"></div>`:''}
      </div>`).join('')}
  </div>
  <div class="flex justify-between text-[10px] text-ink-400 mb-3">
    ${orden.map(e=>`<span class="${e===o.estado?'font-semibold text-ink-700':''}">${e}</span>`).join('')}
  </div>
  ${enPausa ? `<p class="text-xs text-amber-600 mb-3">⏸ Actualmente en pausa: <strong>${o.estado}</strong></p>` : ''}
  ${cancelada ? `<p class="text-xs text-red-600 mb-3">✕ Esta OTM fue cancelada.</p>` : ''}
  `;
}

function switchTab(btn, tabId){
  const modal = btn.closest('.modal-panel');
  modal.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  modal.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
  modal.querySelector('#'+tabId).classList.remove('hidden');
}

function addTecnicoToOTM(id){
  const sel = document.getElementById('addTecnicoSel_'+id);
  if(!sel.value) return;
  const o = OTMS.find(x=>x.id===id);
  o.personalAsignado.push(sel.value);
  o.internos = o.personalAsignado.length;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  toast(`${sel.value} agregado a la OTM`);
  openVerModal(o);
}
function removeTecnicoFromOTM(id, nombre){
  const o = OTMS.find(x=>x.id===id);
  o.personalAsignado = o.personalAsignado.filter(n=>n!==nombre);
  o.internos = o.personalAsignado.length;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  openVerModal(o);
}
function updateExternos(id){
  const o = OTMS.find(x=>x.id===id);
  const val = Math.max(0, parseInt(document.getElementById('externosInput_'+id).value)||0);
  o.externos = val;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  toast(`Personal externo actualizado a ${val}`);
  openVerModal(o);
}
function removeMaterialFromOTM(id, idx){
  const o = OTMS.find(x=>x.id===id);
  const [quitado] = o.materiales.splice(idx,1);
  if(quitado && MAT_NUEVOS[id]){   // si estaba pendiente de enviar, se quita también
    MAT_NUEVOS[id] = MAT_NUEVOS[id].filter(x=>x.codigo!==String(quitado.codigo));
    if(!MAT_NUEVOS[id].length) delete MAT_NUEVOS[id];
    guardarMatNuevos();
  }
  syncOTM(o);
  openVerModal(o);
}
function recalcEjecucion(id){
  const j = parseFloat(document.getElementById('ejec_jornales_'+id).value)||0;
  const h = parseFloat(document.getElementById('ejec_horas_'+id).value)||0;
  document.getElementById('ejec_hh_'+id).textContent = (j*h).toFixed(1);
}
function guardarEjecucion(id){
  const o = OTMS.find(x=>x.id===id);
  const j = parseFloat(document.getElementById('ejec_jornales_'+id).value)||0;
  const h = parseFloat(document.getElementById('ejec_horas_'+id).value)||0;
  o.jornalesEjecutados = j;
  o.horasEjecutadas = h;
  o.hh = +(j*h).toFixed(1);
  o.comentarioCierre = document.getElementById('ejec_comentario_'+id).value;
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`Ejecución de ${id} guardada (${o.hh} HH)`);
}

function saveEdicion(id){
  const o = OTMS.find(x=>x.id===id);
  o.prioridad = document.getElementById('edit_prioridad').value;
  o.responsable = document.getElementById('edit_responsable').value;
  o.componente = document.getElementById('edit_componente').value;
  o.sintoma = document.getElementById('edit_sintoma').value;
  o.causa = document.getElementById('edit_causa').value;
  o.medida = document.getElementById('edit_medida').value;
  o.actividadRealizada = document.getElementById('edit_actrealizada').value;
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`OTM ${id} actualizada`);
}

function confirmarCambioEstado(id){
  const o = OTMS.find(x=>x.id===id);
  const nuevo = document.getElementById('nuevoEstado').value;
  const sinHoras = nuevo==='Completada' && !(o.horasEjecutadas>0);
  o.estado = nuevo;
  o.historial.push({estado:nuevo, fecha:new Date()});
  // (antes se escribía un texto automático de "Actividad realizada" que no reflejaba lo real)
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`OTM ${id} cambió a estado "${nuevo}"`);
  if(sinHoras) setTimeout(()=>toast('Aviso: la OTM se completó sin jornales/horas registrados. Puedes cargarlos en Ver → "Ejecución y cierre".', 'info'), 400);
}

        </div>
      </div>
    </div>`;
}
/* Se quita de la pantalla al instante y se borra del Sheet en segundo plano.
   Si el Sheet falla, la OTM vuelve a aparecer. */
async function confirmarEliminarOTM(id){
  const idx = OTMS.findIndex(x=>x.id===id);
  if(idx < 0){ closeModal(); return; }
  const [quitada] = OTMS.splice(idx, 1);
  closeModal();
  paintGestionCards();
  pendientesSync++; paintSyncStatus();
  try{
    await apiPost('eliminar_otm', {id});
    toast(`OTM ${id} eliminada`);
  }catch(err){
    if(/no se encontr/i.test(err.message)){ toast(`OTM ${id} eliminada`); }   // ya no existía en el Sheet
    else{
      OTMS.splice(idx, 0, quitada);
      paintGestionCards();
      toast('No se pudo eliminar: '+err.message, 'error');
    }
  }finally{ pendientesSync--; paintSyncStatus(); }
}

/* Agrega (o suma) un material a una OTM */
function sumarMaterialAOTM(o, m, cant){
  const ya = o.materiales.find(x=>String(x.codigo)===m.codigo);
  if(ya) ya.cantidad = +(Number(ya.cantidad) + cant).toFixed(3);
  else o.materiales.push({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:cant});
}

function confirmarAgregarMaterialOTM(otmId, enviarWA){
  const codigo = document.getElementById('qmat_codigo').value;
  const cant = parseFloat(document.getElementById('qmat_cant').value);
  if(!codigo){ toast('Selecciona un material de la lista', 'error'); return; }
  if(!(cant > 0)){ toast('La cantidad debe ser mayor a 0', 'error'); return; }
  const m = MATERIALES.find(x=>x.codigo===String(codigo));
  if(!m){ toast('Material no encontrado en el catálogo', 'error'); return; }
  const o = OTMS.find(x=>x.id===otmId);
  sumarMaterialAOTM(o, m, cant);
  registrarMatNuevo(otmId, m, cant);
  syncOTM(o);
  if(cant > m.stock){
    toast(`Se registró la necesidad de ${cant} ${m.unidad}. Stock disponible: ${m.stock} — considera pasar la OTM a "Esperando material".`, 'error');
  } else {
    toast(`${m.codigo} agregado a ${otmId} (${cant} ${m.unidad})`);
  }
  closeModal();
  paintGestionCards();
  if(enviarWA) enviarMatNuevosWhatsApp(otmId);
}

   ========================================================= */

let matLista = [];             // resultado de la búsqueda actual
let matMostrados = MAT_PAGE;
let matTimer = null;

function paintMateriales(){
  const body = document.getElementById('matBody');
  if(!body) return;
  document.getElementById('matCount').textContent = matLista.length;
  const more = document.getElementById('matMore');
  if(matLista.length===0){
    body.innerHTML = MATERIALES_CARGADOS ? `<tr><td colspan="6" class="text-center py-10 text-ink-400 text-sm">No se encontraron materiales.</td></tr>` : '';
    more.innerHTML = '';
    return;
  }
  body.innerHTML = matLista.slice(0, matMostrados).map(m=>{
    let estado, cls;
    if(m.stock===0){ estado='Agotado'; cls='bg-red-50 text-red-700 ring-1 ring-red-200'; }
    else if(m.stock<m.min){ estado='Stock bajo'; cls='bg-amber-50 text-amber-700 ring-1 ring-amber-200'; }
    else { estado='Disponible'; cls='bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200'; }
    return `
    <tr class="border-b border-ink-50 hover:bg-ink-50/60">
      <td class="hidden sm:table-cell py-2.5 px-4 font-medium text-ink-800 whitespace-nowrap">${esc(m.codigo)}</td>
      <td class="py-2.5 px-3 sm:px-4 text-ink-600">
        <span class="sm:hidden block text-[11px] font-semibold text-ink-400">${esc(m.codigo)}</span>${esc(m.desc)}
      </td>
      <td class="hidden sm:table-cell py-2.5 px-4 text-ink-500">${esc(m.unidad)}</td>
      <td class="py-2.5 px-3 sm:px-4 text-ink-800 font-medium text-right sm:text-left whitespace-nowrap">${m.stock}<span class="sm:hidden text-[11px] text-ink-400 font-normal"> ${esc(m.unidad)}</span>
        <span class="sm:hidden block"><span class="chip px-1.5 py-0.5 rounded-full text-[10px] font-medium ${cls}">${estado}</span></span></td>
      <td class="hidden sm:table-cell py-2.5 px-4"><span class="chip px-2.5 py-1 rounded-full text-xs font-medium ${cls}">${estado}</span></td>
      <td class="py-2.5 px-3 sm:px-4 text-right">
        <button onclick="openAsociarMaterial('${jsq(m.codigo)}')" class="text-xs font-medium text-brand-600 hover:text-brand-700 whitespace-nowrap px-2 py-2 sm:p-0">+ <span class="hidden sm:inline">Asociar a </span>OTM</button>
      </td>
    </tr>`;
  }).join('');
  const resto = matLista.length - matMostrados;
  more.innerHTML = resto > 0
    ? `<button onclick="matVerMas()" class="px-4 py-2 rounded-lg border border-ink-200 text-xs font-medium text-ink-600 hover:bg-ink-50">Mostrar ${Math.min(resto, MAT_PAGE)} más (quedan ${resto})</button>`
    : '';
}
function matVerMas(){ matMostrados += MAT_PAGE; paintMateriales(); }
function onMatSearch(){
  clearTimeout(matTimer);
  matTimer = setTimeout(filterMateriales, 200);   // espera a que el usuario deje de escribir
}
/* Busca por código o descripción; las palabras pueden ir en cualquier orden y sin tildes.
   "pvc codo 2" encuentra "CODO PVC 2\" x 90°" */
function filterMateriales(){
  const toks = tokens(document.getElementById('matSearch').value);
  matLista = toks.length ? MATERIALES.filter(m => coincide(m._q, toks)) : MATERIALES;
  matMostrados = MAT_PAGE;
  paintMateriales();
}

/* ---- Asociar material a OTM, con filtro por las 3 últimas semanas ---- */
let asocSemanas = new Set();   // lunes (ISO) de las semanas seleccionadas; vacío = todas
let asocCodigo = null;

function otmsAbiertasFiltradas(){
  const abiertas = OTMS.filter(o=>!ESTADOS_TERMINALES.includes(o.estado));
  if(asocSemanas.size===0) return abiertas;
  const rangos = [...asocSemanas].map(ini=>[ini, addDaysISO(ini, 6)]);
  return abiertas.filter(o=>{ const f = isoDate(o.fecha); return rangos.some(([a,b])=> f>=a && f<=b); });
}
function toggleSemanaAsoc(ini){
  asocSemanas.has(ini) ? asocSemanas.delete(ini) : asocSemanas.add(ini);
  paintAsocFiltro();
}
function limpiarSemanasAsoc(){ asocSemanas.clear(); paintAsocFiltro(); }
function paintAsocFiltro(){
  const wrap = document.getElementById('asoc_semanas');
  const sel = document.getElementById('asoc_otm');
  if(!wrap || !sel) return;
  wrap.innerHTML = ultimasSemanas(3).map(w=>{
    const on = asocSemanas.has(w.ini);
    return `<button type="button" onclick="toggleSemanaAsoc('${w.ini}')"
      class="px-2.5 py-1.5 rounded-lg text-xs font-medium border ${on?'bg-brand-600 text-white border-brand-600':'border-ink-200 text-ink-600 hover:bg-ink-50'}">
      ${w.label}<span class="block text-[10px] font-normal ${on?'text-white/80':'text-ink-400'}">Sem ${w.num} · ${ddmm(w.ini)}–${ddmm(w.fin)}</span></button>`;
  }).join('') + `<button type="button" onclick="limpiarSemanasAsoc()" class="px-2.5 py-1.5 rounded-lg text-xs font-medium border border-dashed border-ink-300 text-ink-500 hover:text-red-600 hover:border-red-300">Limpiar filtro</button>`;
  const lista = otmsAbiertasFiltradas();
  sel.innerHTML = lista.length
    ? lista.map(o=>`<option value="${o.id}">${fmtDate(o.fecha)} · ${o.id} · ${esc(o.equipo)} — ${esc(o.actividad)}</option>`).join('')
    : `<option value="">No hay OTM abiertas en la(s) semana(s) seleccionada(s)</option>`;
  document.getElementById('asoc_total').textContent = `${lista.length} OTM abiertas${asocSemanas.size?' en el filtro':''}`;
}
function openAsociarMaterial(codigo){
  const m = MATERIALES.find(x=>x.codigo===String(codigo));
  if(!m) return;
  const abiertas = OTMS.filter(o=>!ESTADOS_TERMINALES.includes(o.estado));
  if(abiertas.length===0){ toast('No hay OTM abiertas para asociar materiales', 'error'); return; }
  asocCodigo = m.codigo;
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 z-40 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="modal-panel bg-white rounded-xl shadow-pop w-full max-w-lg">
        <div class="px-5 py-4 border-b border-ink-100">
          <h3 class="font-semibold text-ink-900">Asociar material a OTM</h3>
          <p class="text-xs text-ink-400">${esc(m.codigo)} · ${esc(m.desc)}</p>
        </div>
        <div class="px-5 py-5 space-y-4">
          <div>
            <label class="block text-sm font-medium text-ink-700 mb-1.5">Filtrar OTM por semana</label>
            <div id="asoc_semanas" class="flex flex-wrap gap-2"></div>
          </div>
          <div>
            <div class="flex items-baseline justify-between mb-1.5">
              <label class="block text-sm font-medium text-ink-700">OTM destino</label>
              <span id="asoc_total" class="text-[11px] text-ink-400"></span>
            </div>
            <select id="asoc_otm" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm"></select>
          </div>
          <div>
            <label class="block text-sm font-medium text-ink-700 mb-1.5">Cantidad</label>
            <input type="number" id="asoc_cant" min="0.01" step="any" value="1" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            <p id="asoc_stockinfo" class="text-[11px] text-ink-400 mt-1">Stock disponible: ${m.stock} ${esc(m.unidad)}${m.stock < m.min ? ' · <span class="text-amber-600 font-medium">stock bajo</span>':''}</p>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onclick="confirmarAsociarMaterial(true)" title="Agregar y enviar por WhatsApp solo los materiales recién añadidos" class="flex items-center gap-1.5 px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-medium">${iconWhatsapp()}<span class="hidden sm:inline">Agregar y enviar</span><span class="sm:hidden">Enviar</span></button>
          <button onclick="confirmarAsociarMaterial(false)" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Agregar a la OTM</button>
        </div>
      </div>
    </div>
  `;
  paintAsocFiltro();
  cargarMaterialesEnSegundoPlano(30000);   // confirma el stock actual mientras eliges la OTM
}
function confirmarAsociarMaterial(enviarWA){
  const m = MATERIALES.find(x=>x.codigo===asocCodigo);
  const otmId = document.getElementById('asoc_otm').value;
  const cant = parseFloat(document.getElementById('asoc_cant').value);
  if(!otmId){ toast('Selecciona una OTM destino', 'error'); return; }
  if(!(cant > 0)){ toast('La cantidad debe ser mayor a 0', 'error'); return; }
  const o = OTMS.find(x=>x.id===otmId);
  if(!o || !m) return;
  sumarMaterialAOTM(o, m, cant);
  registrarMatNuevo(otmId, m, cant);
  syncOTM(o);
  if(cant > m.stock){
    toast(`Se registró la necesidad de ${cant} ${m.unidad}. Stock disponible: ${m.stock} — se recomienda pasar la OTM a "Esperando material".`, 'error');
  } else {
    toast(`${m.codigo} agregado a ${otmId} (${cant} ${m.unidad})`);
  }
  closeModal();
  if(enviarWA) enviarMatNuevosWhatsApp(otmId);   // envía SOLO los recién añadidos
  else paintMatPendientes();
}


/* Init */
initApp();
</script>
</body>
</html>
