<script>
/* =========================================================
   CONEXIÓN A GOOGLE SHEETS (Apps Script Web App)
   ========================================================= */
const CONFIG = {
  // Pegar acá la URL que entrega Apps Script al publicar ("Implementar > Nueva implementación > Aplicación web")
  API_URL: 'https://script.google.com/macros/s/AKfycby5adGxSt6whoB_ap98AMo7Px_geCMD9WruevmUrHyRuo_1iMxUjJIrNxruQSLyTcXu/exec'
};

async function apiGet(){
  const res = await fetch(CONFIG.API_URL + '?action=snapshot', {method:'GET'});
  if(!res.ok) throw new Error('No se pudo leer el Sheet ('+res.status+')');
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Error desconocido leyendo el Sheet');
  return data;
}
async function apiPost(action, payload){
  // Content-Type text/plain evita el preflight CORS que Apps Script no responde bien
  const res = await fetch(CONFIG.API_URL, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action, payload})
  });
  const data = await res.json();
  if(!data.ok) throw new Error(data.error || 'Error desconocido guardando en el Sheet');
  return data;
}
function syncOTM(o){
  apiPost('upsert_otm', {otm:o}).catch(err=>{
    console.error(err);
    toast('No se pudo sincronizar con el Sheet: '+err.message, 'error');
  });
}

   Cancelada es posible desde cualquier estado previo al cierre.

function isoDate(d){ return d.toISOString().slice(0,10); }

/* =========================================================
   CARGA DE DATOS REALES DESDE EL GOOGLE SHEET
   ========================================================= */
async function loadDataFromSheet(){
  const data = await apiGet(); // { equipos, actividades, personal, materiales, otms }

  EQUIPOS = data.equipos;
  ACTIVIDADES = data.actividades;
  PERSONAL = data.personal;
  RESPONSABLES = PERSONAL.filter(p=>p.cargo==='Supervisor' && p.estado==='Activo').map(p=>p.nombre);
  TECNICOS = PERSONAL.filter(p=>p.cargo==='Técnico' && p.estado==='Activo').map(p=>p.nombre);
  MATERIALES = data.materiales;

  OTMS = data.otms.map(o=>({
    ...o,
    fecha: new Date(o.fecha),
    historial: (o.historial||[]).map(h=>({estado:h.estado, fecha:new Date(h.fecha)})),
  }));
  OTMS.sort((a,b)=> b.fecha - a.fecha);
}

  const root = document.getElementById('view-gestion');

    await loadDataFromSheet();
    renderGestion();
  }catch(err){
    console.error(err);
    root.innerHTML = `<div class="bg-white rounded-xl shadow-card border border-red-200 p-6 text-sm text-red-700">
      No se pudo cargar la información desde el Sheet.<br>

function navigate(view){
  document.querySelectorAll('[id^="view-"]').forEach(el=>el.classList.add('hidden'));
  document.getElementById('view-'+view).classList.remove('hidden');
  document.querySelectorAll('.nav-link').forEach(el=>el.classList.toggle('active', el.dataset.view===view));
  document.getElementById('pageTitle').textContent = TITLES[view][0];
  document.getElementById('pageSubtitle').textContent = TITLES[view][1];
  if(view==='dashboard') renderDashboard();
  if(view==='crear') renderCrear();
  if(view==='gestion') renderGestion();
  if(view==='materiales') renderMateriales();
  if(window.innerWidth < 1024){ document.getElementById('sidebar').classList.add('-translate-x-full'); document.getElementById('sidebarOverlay').classList.add('hidden'); }
  window.scrollTo({top:0,behavior:'smooth'});
}
function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebarOverlay').classList.toggle('hidden');
}
function toast(msg, type='success'){
  const colors = {success:'bg-emerald-600', error:'bg-red-600', info:'bg-brand-600'};
  const el = document.createElement('div');
  el.className = `toast ${colors[type]} text-white text-sm font-medium px-4 py-2.5 rounded-lg shadow-pop flex items-center gap-2 max-w-sm`;
  el.innerHTML = `<span>${msg}</span>`;
  document.getElementById('toastContainer').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 3200);
}

  };

    'Pendiente':'bg-ink-400','Programada':'bg-brand-500','En ejecución':'bg-white',
    'Esperando material':'bg-orange-500','Esperando aprobación':'bg-violet-500',
    'Completada':'bg-emerald-500','Cancelada':'bg-red-500'

/* =========================================================
   AUTOCOMPLETADO GENÉRICO (equipo, actividad, material)
   ========================================================= */
function wireAutocomplete({inputId, listId, itemsProvider, onPick, emptyText}){
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  if(!input || !list) return;
  function show(query){
    if(input.disabled) return;
    const items = itemsProvider();
    const q = (query||'').toLowerCase();
    const filtered = items.filter(it=> it.label.toLowerCase().includes(q));
    if(filtered.length===0){
      list.innerHTML = `<div class="px-3 py-2 text-xs text-ink-400">${emptyText||'Sin resultados'}</div>`;
    } else {
      list.innerHTML = filtered.slice(0,60).map(it=>`<div class="ac-opt px-3 py-2 text-sm hover:bg-brand-50 cursor-pointer" data-value="${it.value}" data-label="${it.label.replace(/"/g,'&quot;')}">${it.label}</div>`).join('');
    }
    list.classList.remove('hidden');
  }
  input.addEventListener('focus', ()=> show(input.value));
  input.addEventListener('input', ()=> show(input.value));
  list.addEventListener('mousedown', (e)=>{
    const opt = e.target.closest('.ac-opt');
    if(!opt) return;
    input.value = opt.dataset.label;
    list.classList.add('hidden');
    onPick(opt.dataset.value, opt.dataset.label);
  });
  document.addEventListener('click', (e)=>{
    if(e.target!==input && !list.contains(e.target)) list.classList.add('hidden');
  });
}

let dashboardFilter = {estado:null, tipo:null, prioridad:null, responsable:null};
function applyDashboardFilter(list){
  return list.filter(o=>{
    if(dashboardFilter.estado && o.estado!==dashboardFilter.estado) return false;
    if(dashboardFilter.tipo && o.tipoMtto!==dashboardFilter.tipo) return false;
    if(dashboardFilter.prioridad && o.prioridad!==dashboardFilter.prioridad) return false;
    if(dashboardFilter.responsable && o.responsable!==dashboardFilter.responsable) return false;
    return true;
  });
}

  dashboardFilter[key] = (dashboardFilter[key]===value) ? null : value;

function wireCrearAutocompletes(){
  wireAutocomplete({
    inputId:'ac_input_equipo', listId:'ac_list_equipo',
    itemsProvider: ()=> EQUIPOS.map(e=>({value:String(e.dni), label:e.nombre})),
    onPick: (dni)=>{
      crearState.equipoDni = dni;
      document.getElementById('f_dni').value = dni;
      crearState.actividadNombre=''; crearState.actividadTipo='';
      const actInput = document.getElementById('ac_input_actividad');
      actInput.value=''; actInput.disabled=false; actInput.placeholder='Escribe para buscar la actividad…';
      document.getElementById('f_tipo_mtto').value='';
      document.getElementById('actividadLibrePanel').classList.add('hidden');
      crearState.actividadLibre=false;
    },
    emptyText:'No se encontró el equipo'
  });
  wireAutocomplete({
    inputId:'ac_input_actividad', listId:'ac_list_actividad',
    itemsProvider: ()=> crearState.equipoDni ? (ACTIVIDADES[crearState.equipoDni]||[]).map(a=>({value:a.tipo, label:a.a})) : [],
    onPick: (tipo,label)=>{
      crearState.actividadNombre = label;
      crearState.actividadTipo = tipo;
      crearState.actividadLibre = false;
      document.getElementById('actividadLibrePanel').classList.add('hidden');
      document.getElementById('f_tipo_mtto').value = TIPO_MTTO_LABEL[tipo];
    },
    emptyText:'No hay actividades registradas para este equipo'
  });
  wireAutocomplete({
    inputId:'ac_input_material', listId:'ac_list_material',
    itemsProvider: ()=> MATERIALES.map(m=>({value:m.codigo, label:`${m.codigo} · ${m.desc} (stock ${m.stock} ${m.unidad})`})),
    onPick: (codigo)=>{ document.getElementById('f_material_codigo').value = codigo; },
    emptyText:'No se encontró el material'
  });
}

function toggleActividadLibre(){
  crearState.actividadLibre = !crearState.actividadLibre;
  document.getElementById('actividadLibrePanel').classList.toggle('hidden', !crearState.actividadLibre);
  if(crearState.actividadLibre){
    document.getElementById('ac_input_actividad').value='';
    crearState.actividadNombre=''; crearState.actividadTipo='';
    document.getElementById('f_tipo_mtto').value='';
  }
}
function selectChip(btn, group, value){
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b=>{
    b.classList.remove('bg-ink-800','text-white','border-ink-800');
    b.classList.add('border-ink-200','text-ink-600');
  });
  btn.classList.add('bg-ink-800','text-white','border-ink-800');
  btn.classList.remove('border-ink-200','text-ink-600');
  document.getElementById('f_'+group).value = value;
}
function toggleTecnico(btn, nombre){
  const idx = crearState.selectedTecnicos.indexOf(nombre);
  if(idx>-1){ crearState.selectedTecnicos.splice(idx,1); btn.classList.remove('bg-brand-600','text-white','border-brand-600'); btn.classList.add('border-ink-200','text-ink-600'); }
  else { crearState.selectedTecnicos.push(nombre); btn.classList.add('bg-brand-600','text-white','border-brand-600'); btn.classList.remove('border-ink-200','text-ink-600'); }
  document.getElementById('tecnicosCount').textContent = crearState.selectedTecnicos.length;
}
function toggleExterno(){
  crearState.externoActivo = document.getElementById('f_externo').checked;
  document.getElementById('externoFields').classList.toggle('hidden', !crearState.externoActivo);
}
function clearMaterialInput(){
  document.getElementById('ac_input_material').value='';
  document.getElementById('f_material_codigo').value='';
}
function abrirMaterialForm(){
  document.getElementById('materialAddFields').classList.remove('hidden');
  document.getElementById('btnAbrirMaterialForm').classList.add('hidden');
  document.getElementById('ac_input_material').focus();
}
function cerrarMaterialForm(){
  clearMaterialInput();
  document.getElementById('f_material_cant').value = 1;
  document.getElementById('materialAddFields').classList.add('hidden');
  document.getElementById('btnAbrirMaterialForm').classList.remove('hidden');
}
function agregarMaterialForm(){
  const codigo = document.getElementById('f_material_codigo').value;
  const cant = parseInt(document.getElementById('f_material_cant').value)||1;
  if(!codigo){ toast('Selecciona un material de la lista', 'error'); return; }
  const m = MATERIALES.find(x=>x.codigo===codigo);
  crearState.materiales.push({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:cant, stock:m.stock});
  paintMaterialesForm();
  cerrarMaterialForm();
}
function quitarMaterialForm(i){
  crearState.materiales.splice(i,1);
  paintMaterialesForm();
}
function paintMaterialesForm(){
  const el = document.getElementById('materialesFormList');
  if(!el) return;
  if(crearState.materiales.length===0){ el.innerHTML = ''; return; }
  el.innerHTML = crearState.materiales.map((m,i)=>`
    <div class="flex items-center justify-between gap-3 bg-ink-50 rounded-lg px-3 py-2 text-sm">
      <div class="min-w-0">
        <p class="font-medium text-ink-800 truncate">${m.codigo} · ${m.desc}</p>
        <p class="text-xs text-ink-400">Cantidad: ${m.cantidad} ${m.unidad}
          ${m.cantidad > m.stock ? `<span class="ml-1.5 text-amber-600 font-medium">⚠ stock disponible: ${m.stock}</span>` : ''}
        </p>
      </div>
      <button type="button" onclick="quitarMaterialForm(${i})" class="text-ink-400 hover:text-red-600 flex-shrink-0">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
      </button>
    </div>`).join('');
}

function construirOTMDesdeFormulario(){
  const equipo = EQUIPOS.find(x=>String(x.dni)===crearState.equipoDni);
  if(!equipo){ toast('Selecciona un equipo de la lista', 'error'); return null; }

  let actividadNombre, actividadTipo, esActividadLibre=false;
  if(crearState.actividadLibre){
    actividadNombre = document.getElementById('f_actividad_libre_nombre').value.trim();
    actividadTipo = document.getElementById('f_actividad_libre_tipo').value;
    esActividadLibre = true;
    if(!actividadNombre){ toast('Escribe el nombre de la nueva actividad', 'error'); return null; }
    if(!ACTIVIDADES[crearState.equipoDni]) ACTIVIDADES[crearState.equipoDni] = [];
    ACTIVIDADES[crearState.equipoDni].push({a:actividadNombre, tipo:actividadTipo});
    apiPost('nueva_actividad', {dni:crearState.equipoDni, actividad:actividadNombre, tipo:actividadTipo})
      .catch(err=>{ console.error(err); toast('No se pudo guardar la nueva actividad en el Sheet: '+err.message, 'error'); });
  } else {
    actividadNombre = crearState.actividadNombre;
    actividadTipo = crearState.actividadTipo;
    if(!actividadNombre){ toast('Selecciona una actividad o usa texto libre', 'error'); return null; }
  }

  if(crearState.externoActivo){
    const cantExt = parseInt(document.getElementById('f_cant_externos').value)||0;
    if(cantExt < 1){ toast('La cantidad de externos debe ser mayor o igual a 1', 'error'); return null; }
  }

  const internos = crearState.selectedTecnicos.length;
  const externos = crearState.externoActivo ? Math.max(1, parseInt(document.getElementById('f_cant_externos').value)||0) : 0;
  const participantes = internos + externos;
  const fecha = new Date(document.getElementById('f_fecha').value);

  return {
    id: `OTM-${Date.now().toString().slice(-6)}-${OTMS.length+1}`,
    fecha,
    equipo: equipo.nombre,
    dni: equipo.dni,
    actividad: actividadNombre,
    esActividadLibre,
    tipoMtto: actividadTipo,
    prioridad: document.getElementById('f_prioridad').value,
    responsable: document.getElementById('f_responsable').value,
    estado: 'Pendiente',
    internos, externos, participantes,
    empresaContratista: null,
    componente: document.getElementById('f_componente').value || '—',
    sintoma: document.getElementById('f_sintoma').value || '—',
    causa: document.getElementById('f_causa').value || '—',
    medida: document.getElementById('f_medida').value || '—',
    actividadRealizada: '',
    comentarios: '—',
    comentarioCierre: '',
    jornalesEjecutados: null, horasEjecutadas: null, hh: 0,
    personalAsignado: [...crearState.selectedTecnicos],
    materiales: crearState.materiales.map(m=>({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:m.cantidad})),
    historial: [{estado:'Pendiente', fecha}],
  };
}

function submitOTM(e){
  e.preventDefault();
  const nueva = construirOTMDesdeFormulario();
  if(!nueva) return false;
  OTMS.unshift(nueva);
  syncOTM(nueva);
  toast(`OTM ${nueva.id} registrada en estado Pendiente`);
  navigate('gestion');
  return false;
}

function mensajeWhatsAppOTM(o){
  const lineas = [
    `🛠️ *Nueva OTM registrada*`,
    `📋 *OTM:* ${o.id}`,
    `⚙️ *Equipo:* ${o.equipo}`,
    `🔢 *DNI:* ${o.dni}`,
    `🧰 *Actividad:* ${o.actividad}`,
    `🏷️ *Tipo:* ${TIPO_MTTO_LABEL[o.tipoMtto]} (${TIPO_ORDEN_SAP[o.tipoMtto]})`,
    `🚦 *Prioridad:* ${o.prioridad}`,
    `👷 *Responsable:* ${o.responsable}`,
    `📅 *Fecha:* ${fmtDate(o.fecha)}`,
  ];
  if(o.materiales && o.materiales.length){
    lineas.push(`📦 *Materiales solicitados:*`);
    o.materiales.forEach(m=>{
      lineas.push(`▫️ ${m.codigo} - ${m.desc} — Cant: ${m.cantidad} ${m.unidad}`);
    });
  }
  return lineas.join('\n');
}
function registrarYCompartirWhatsApp(){
  const nueva = construirOTMDesdeFormulario();
  if(!nueva) return;
  OTMS.unshift(nueva);
  syncOTM(nueva);
  toast(`OTM ${nueva.id} registrada en estado Pendiente`);
  const url = `https://wa.me/?text=${encodeURIComponent(mensajeWhatsAppOTM(nueva))}`;
  window.open(url, '_blank');
  navigate('gestion');
}

function onQueryInput(){ gestionQuery = document.getElementById('filt_q').value.trim().toLowerCase(); paintGestionCards(); }
function onFiltroChange(){
  gestionFiltros.estado = document.getElementById('filt_estado').value;
  gestionFiltros.prioridad = document.getElementById('filt_prioridad').value;
  gestionFiltros.responsable = document.getElementById('filt_responsable').value;
  paintGestionCards();
}
function resetFiltros(){
  gestionQuery=''; gestionFecha=''; gestionFiltros={estado:'',prioridad:'',responsable:'',equipo:''};
  renderGestion();
}

function filteredOTMs(){
  return OTMS.filter(o=>{
    if(gestionFecha && isoDate(o.fecha)!==gestionFecha) return false;
    if(gestionQuery && !(o.equipo.toLowerCase().includes(gestionQuery) || o.responsable.toLowerCase().includes(gestionQuery) || o.id.toLowerCase().includes(gestionQuery) || o.actividad.toLowerCase().includes(gestionQuery))) return false;
    if(gestionFiltros.estado && o.estado!==gestionFiltros.estado) return false;
    if(gestionFiltros.prioridad && o.prioridad!==gestionFiltros.prioridad) return false;
    if(gestionFiltros.responsable && o.responsable!==gestionFiltros.responsable) return false;
    return true;
  });
}

/* ---- Modal: Ver (con Ejecución/cierre) / Editar / Cambiar estado ---- */
function openOTM(id, modo){
  const o = OTMS.find(x=>x.id===id);
  if(!o) return;
  if(modo==='ver') return openVerModal(o);
  if(modo==='editar') return openEditarModal(o);
  if(modo==='estado') return openEstadoModal(o);
}

function stepFlow(o){
  const orden = ['Pendiente','Programada','En ejecución','Completada'];
  const cancelada = o.estado==='Cancelada';
  const enPausa = o.estado==='Esperando material' || o.estado==='Esperando aprobación';
  const idxActual = enPausa ? 2 : orden.indexOf(o.estado);
  return `
  <div class="flex items-center mb-1">
    ${orden.map((e,i)=>`
      <div class="flex items-center ${i<orden.length-1?'flex-1':''}">
        <div class="step-dot ${cancelada ? 'bg-red-400' : i<=idxActual ? 'bg-brand-600':'bg-ink-200'}"></div>
        ${i<orden.length-1?`<div class="step-line ${cancelada ? 'bg-red-200' : i<idxActual ? 'bg-brand-600':'bg-ink-200'}"></div>`:''}
      </div>`).join('')}
  </div>
  <div class="flex justify-between text-[10px] text-ink-400 mb-3">
    ${orden.map(e=>`<span class="${e===o.estado?'font-semibold text-ink-700':''}">${e}</span>`).join('')}
  </div>
  ${enPausa ? `<p class="text-xs text-amber-600 mb-3">⏸ Actualmente en pausa: <strong>${o.estado}</strong></p>` : ''}
  ${cancelada ? `<p class="text-xs text-red-600 mb-3">✕ Esta OTM fue cancelada.</p>` : ''}
  `;
}

function switchTab(btn, tabId){
  const modal = btn.closest('.modal-panel');
  modal.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  modal.querySelectorAll('.tab-panel').forEach(p=>p.classList.add('hidden'));
  modal.querySelector('#'+tabId).classList.remove('hidden');
}

function addTecnicoToOTM(id){
  const sel = document.getElementById('addTecnicoSel_'+id);
  if(!sel.value) return;
  const o = OTMS.find(x=>x.id===id);
  o.personalAsignado.push(sel.value);
  o.internos = o.personalAsignado.length;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  toast(`${sel.value} agregado a la OTM`);
  openVerModal(o);
}
function removeTecnicoFromOTM(id, nombre){
  const o = OTMS.find(x=>x.id===id);
  o.personalAsignado = o.personalAsignado.filter(n=>n!==nombre);
  o.internos = o.personalAsignado.length;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  openVerModal(o);
}
function updateExternos(id){
  const o = OTMS.find(x=>x.id===id);
  const val = Math.max(0, parseInt(document.getElementById('externosInput_'+id).value)||0);
  o.externos = val;
  o.participantes = o.internos + o.externos;
  syncOTM(o);
  toast(`Personal externo actualizado a ${val}`);
  openVerModal(o);
}
function removeMaterialFromOTM(id, idx){
  const o = OTMS.find(x=>x.id===id);
  o.materiales.splice(idx,1);
  syncOTM(o);
  openVerModal(o);
}
function recalcEjecucion(id){
  const j = parseFloat(document.getElementById('ejec_jornales_'+id).value)||0;
  const h = parseFloat(document.getElementById('ejec_horas_'+id).value)||0;
  document.getElementById('ejec_hh_'+id).textContent = (j*h).toFixed(1);
}
function guardarEjecucion(id){
  const o = OTMS.find(x=>x.id===id);
  const j = parseFloat(document.getElementById('ejec_jornales_'+id).value)||0;
  const h = parseFloat(document.getElementById('ejec_horas_'+id).value)||0;
  o.jornalesEjecutados = j;
  o.horasEjecutadas = h;
  o.hh = +(j*h).toFixed(1);
  o.comentarioCierre = document.getElementById('ejec_comentario_'+id).value;
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`Ejecución de ${id} guardada (${o.hh} HH)`);
}

            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-ink-500 mb-1">Componente afectado</label>
              <input id="edit_componente" type="text" value="${o.componente}" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-ink-500 mb-1">Síntoma de avería</label>
              <input id="edit_sintoma" type="text" value="${o.sintoma}" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-ink-500 mb-1">Causa de avería</label>
              <input id="edit_causa" type="text" value="${o.causa}" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-ink-500 mb-1">Medida a tomar</label>
              <input id="edit_medida" type="text" value="${o.medida}" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            </div>
            <div class="sm:col-span-2">
              <label class="block text-xs font-medium text-ink-500 mb-1">Actividad realizada</label>
              <textarea id="edit_actrealizada" rows="2" placeholder="Complete al finalizar la ejecución" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">${o.actividadRealizada}</textarea>
            </div>
          </div>
          <p class="text-[11px] text-ink-400 mt-3">Los jornales, horas ejecutadas y el comentario de cierre se registran desde "Ejecución y cierre" en Ver. El cambio de estado se realiza desde "Cambiar estado".</p>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onclick="saveEdicion('${o.id}')" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Guardar cambios</button>
        </div>
      </div>
    </div>
  `;
}
function saveEdicion(id){
  const o = OTMS.find(x=>x.id===id);
  o.prioridad = document.getElementById('edit_prioridad').value;
  o.responsable = document.getElementById('edit_responsable').value;
  o.componente = document.getElementById('edit_componente').value;
  o.sintoma = document.getElementById('edit_sintoma').value;
  o.causa = document.getElementById('edit_causa').value;
  o.medida = document.getElementById('edit_medida').value;
  o.actividadRealizada = document.getElementById('edit_actrealizada').value;
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`OTM ${id} actualizada`);
}

function openEstadoModal(o){
  const next = ESTADO_TRANSICIONES[o.estado];
  if(next.length===0){
    document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 z-40 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="modal-panel bg-white rounded-xl shadow-pop w-full max-w-md">
        <div class="px-5 py-4 border-b border-ink-100">
          <h3 class="font-semibold text-ink-900">Cambiar estado</h3>
          <p class="text-xs text-ink-400">${o.id}</p>
        </div>
        <div class="px-5 py-5">
          ${badgeEstado(o.estado)}
          <p class="text-sm text-ink-600 mt-3">Esta OTM se encuentra en un estado final y no admite más transiciones.</p>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cerrar</button>
        </div>
      </div>
    </div>`;
    return;
  }
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 z-40 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="modal-panel bg-white rounded-xl shadow-pop w-full max-w-md">
        <div class="px-5 py-4 border-b border-ink-100">
          <h3 class="font-semibold text-ink-900">Cambiar estado</h3>
          <p class="text-xs text-ink-400">${o.id} · ${o.equipo}</p>
        </div>
        <div class="px-5 py-5">
          <p class="text-xs text-ink-400 mb-1">Estado actual</p>
          <div class="mb-4">${badgeEstado(o.estado)}</div>
          <label class="block text-sm font-medium text-ink-700 mb-1.5">Nuevo estado</label>
          <select id="nuevoEstado" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            ${next.map(e=>`<option value="${e}">${e}</option>`).join('')}
          </select>
          <p class="text-[11px] text-ink-400 mt-2">Solo se muestran las transiciones válidas según el flujo de la OTM.</p>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onclick="confirmarCambioEstado('${o.id}')" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Confirmar</button>
        </div>
      </div>
    </div>
  `;
}
function confirmarCambioEstado(id){
  const o = OTMS.find(x=>x.id===id);
  const nuevo = document.getElementById('nuevoEstado').value;
  o.estado = nuevo;
  o.historial.push({estado:nuevo, fecha:new Date()});
  if(nuevo==='Completada' && !o.actividadRealizada){
    o.actividadRealizada = 'Trabajo ejecutado conforme a lo programado. Verificación funcional satisfactoria.';
  }
  syncOTM(o);
  closeModal();
  paintGestionCards();
  toast(`OTM ${id} cambió a estado "${nuevo}"`);
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ---- Agregar material directo a una OTM (desde tarjeta) ---- */
function openAgregarMaterialOTM(otmId){
  const o = OTMS.find(x=>x.id===otmId);
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 z-40 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="modal-panel bg-white rounded-xl shadow-pop w-full max-w-md">
        <div class="px-5 py-4 border-b border-ink-100">
          <h3 class="font-semibold text-ink-900">Agregar material</h3>
          <p class="text-xs text-ink-400">${o.id} · ${o.equipo}</p>
        </div>
        <div class="px-5 py-5 space-y-3">
          <div class="relative">
            <label class="block text-sm font-medium text-ink-700 mb-1.5">Material</label>
            <input type="text" id="ac_input_qmaterial" autocomplete="off" placeholder="Buscar material por código o nombre…" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            <div id="ac_list_qmaterial" class="ac-list hidden"></div>
            <input type="hidden" id="qmat_codigo">
          </div>
          <div>
            <label class="block text-sm font-medium text-ink-700 mb-1.5">Cantidad</label>
            <input type="number" id="qmat_cant" min="1" value="1" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            <p id="qmat_stockinfo" class="text-[11px] text-ink-400 mt-1"></p>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onclick="confirmarAgregarMaterialOTM('${otmId}')" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Agregar</button>
        </div>
      </div>
    </div>
  `;
  wireAutocomplete({
    inputId:'ac_input_qmaterial', listId:'ac_list_qmaterial',
    itemsProvider: ()=> MATERIALES.map(m=>({value:m.codigo, label:`${m.codigo} · ${m.desc} (stock ${m.stock} ${m.unidad})`})),
    onPick: (codigo)=>{
      document.getElementById('qmat_codigo').value = codigo;
      const m = MATERIALES.find(x=>x.codigo===codigo);
      document.getElementById('qmat_stockinfo').innerHTML = `Stock disponible: ${m.stock} ${m.unidad}${m.stock<m.min?' · <span class="text-amber-600 font-medium">stock bajo</span>':''}`;
    },
    emptyText:'No se encontró el material'
  });
}
function confirmarAgregarMaterialOTM(otmId){
  const codigo = document.getElementById('qmat_codigo').value;
  const cant = parseInt(document.getElementById('qmat_cant').value)||1;
  if(!codigo){ toast('Selecciona un material de la lista', 'error'); return; }
  const m = MATERIALES.find(x=>x.codigo===codigo);
  const o = OTMS.find(x=>x.id===otmId);
  o.materiales.push({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:cant});
  syncOTM(o);
  if(cant > m.stock){
    toast(`Se registró la necesidad de ${cant} ${m.unidad}. Stock disponible: ${m.stock} — considera pasar la OTM a "Esperando material".`, 'error');
  } else {
    toast(`${m.codigo} agregado a ${otmId} (${cant} ${m.unidad})`);
  }
  closeModal();
  paintGestionCards();
}

/* =========================================================
   MATERIALES (catálogo)
   ========================================================= */
function renderMateriales(){
  document.getElementById('view-materiales').innerHTML = `
  <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 lg:gap-4 mb-4">
    ${kpiCard('Total materiales', MATERIALES.length, 'ítems en catálogo', 'brand', iconClip())}
    ${kpiCard('Stock bajo', MATERIALES.filter(m=>m.stock>0 && m.stock<m.min).length, 'requieren reposición', 'amber', iconClock())}
    ${kpiCard('Sin stock', MATERIALES.filter(m=>m.stock===0).length, 'ítems agotados', 'ink', iconPause())}
  </div>

  <div class="bg-white rounded-xl shadow-card border border-ink-100 overflow-hidden">
    <div class="px-4 lg:px-5 py-3 border-b border-ink-100 flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between">
      <div class="relative w-full sm:w-80">
        <svg class="w-4 h-4 text-ink-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 10.5A6.5 6.5 0 114 10.5a6.5 6.5 0 0113 0z"/></svg>
        <input id="matSearch" oninput="filterMateriales()" type="text" placeholder="Buscar por código o descripción…" class="w-full border border-ink-200 rounded-lg pl-9 pr-3 py-2 text-sm">
      </div>
      <p class="text-xs text-ink-400"><span id="matCount" class="font-medium text-ink-700">${MATERIALES.length}</span> materiales</p>
    </div>
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-ink-400 text-xs bg-ink-50/60">
            <th class="py-2.5 px-4 font-medium">Material</th>
            <th class="py-2.5 px-4 font-medium">Descripción</th>
            <th class="py-2.5 px-4 font-medium">Unidad</th>
            <th class="py-2.5 px-4 font-medium">Stock</th>
            <th class="py-2.5 px-4 font-medium">Estado</th>
            <th class="py-2.5 px-4 font-medium text-right">Acciones</th>
          </tr>
        </thead>
        <tbody id="matBody"></tbody>
      </table>
    </div>
  </div>
  `;
  paintMateriales(MATERIALES);
}
function paintMateriales(list){
  const body = document.getElementById('matBody');
  document.getElementById('matCount').textContent = list.length;
  if(list.length===0){
    body.innerHTML = `<tr><td colspan="6" class="text-center py-10 text-ink-400 text-sm">No se encontraron materiales.</td></tr>`;
    return;
  }
  body.innerHTML = list.map(m=>{
    let estado, cls;
    if(m.stock===0){ estado='Agotado'; cls='bg-red-50 text-red-700 ring-1 ring-red-200'; }
    else if(m.stock<m.min){ estado='Stock bajo'; cls='bg-amber-50 text-amber-700 ring-1 ring-amber-200'; }
    else { estado='Disponible'; cls='bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200'; }
    return `
    <tr class="border-b border-ink-50 hover:bg-ink-50/60">
      <td class="py-2.5 px-4 font-medium text-ink-800 whitespace-nowrap">${m.codigo}</td>
      <td class="py-2.5 px-4 text-ink-600">${m.desc}</td>
      <td class="py-2.5 px-4 text-ink-500">${m.unidad}</td>
      <td class="py-2.5 px-4 text-ink-800 font-medium">${m.stock}</td>
      <td class="py-2.5 px-4"><span class="chip px-2.5 py-1 rounded-full text-xs font-medium ${cls}">${estado}</span></td>
      <td class="py-2.5 px-4 text-right">
        <button onclick="openAsociarMaterial('${m.codigo}')" class="text-xs font-medium text-brand-600 hover:text-brand-700">+ Asociar a OTM</button>
      </td>
    </tr>`;
  }).join('');
}
function filterMateriales(){
  const q = document.getElementById('matSearch').value.toLowerCase().trim();
  const list = MATERIALES.filter(m => m.desc.toLowerCase().includes(q) || m.codigo.toLowerCase().includes(q));
  paintMateriales(list);
}
function openAsociarMaterial(codigo){
  const m = MATERIALES.find(x=>x.codigo===codigo);
  const abiertas = OTMS.filter(o=>!ESTADOS_TERMINALES.includes(o.estado));
  if(abiertas.length===0){ toast('No hay OTM abiertas para asociar materiales', 'error'); return; }
  document.getElementById('modalRoot').innerHTML = `
    <div class="fixed inset-0 z-40 modal-backdrop flex items-center justify-center p-4" onclick="if(event.target===this) closeModal()">
      <div class="modal-panel bg-white rounded-xl shadow-pop w-full max-w-md">
        <div class="px-5 py-4 border-b border-ink-100">
          <h3 class="font-semibold text-ink-900">Asociar material a OTM</h3>
          <p class="text-xs text-ink-400">${m.codigo} · ${m.desc}</p>
        </div>
        <div class="px-5 py-5 space-y-4">
          <div>
            <label class="block text-sm font-medium text-ink-700 mb-1.5">OTM destino</label>
            <select id="asoc_otm" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
              ${abiertas.map(o=>`<option value="${o.id}">${o.id} · ${o.equipo}</option>`).join('')}
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-ink-700 mb-1.5">Cantidad</label>
            <input type="number" id="asoc_cant" min="1" value="1" class="w-full border border-ink-200 rounded-lg px-3 py-2 text-sm">
            <p class="text-[11px] text-ink-400 mt-1">Stock disponible: ${m.stock} ${m.unidad}${m.stock < m.min ? ' · <span class="text-amber-600 font-medium">stock bajo</span>':''}</p>
          </div>
        </div>
        <div class="flex justify-end gap-3 px-5 py-4 border-t border-ink-100">
          <button onclick="closeModal()" class="px-4 py-2 rounded-lg border border-ink-200 text-sm font-medium text-ink-600 hover:bg-ink-50">Cancelar</button>
          <button onclick="confirmarAsociarMaterial('${codigo}')" class="px-4 py-2 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium">Agregar a la OTM</button>
        </div>
      </div>
    </div>
  `;
}
function confirmarAsociarMaterial(codigo){
  const m = MATERIALES.find(x=>x.codigo===codigo);
  const otmId = document.getElementById('asoc_otm').value;
  const cant = parseInt(document.getElementById('asoc_cant').value)||1;
  const o = OTMS.find(x=>x.id===otmId);
  o.materiales.push({codigo:m.codigo, desc:m.desc, unidad:m.unidad, cantidad:cant});
  syncOTM(o);
  if(cant > m.stock){
    toast(`Se registró la necesidad de ${cant} ${m.unidad}. Stock disponible: ${m.stock} — se recomienda pasar la OTM a "Esperando material".`, 'error');
  } else {
    toast(`${m.codigo} agregado a ${otmId} (${cant} ${m.unidad})`);
  }
  closeModal();
}

/* Init */
initApp();
</script>
</body>
</html>
